<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Du bleibst</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1 class="sr-only">Du bleibst</h1>
  <main class="rows" aria-hidden="true"></main>

  <script>
    // Bildschirm mit Zeilen "Du bleibst" fuellen, abwechselnd links und rechts laufend
    const rows = document.querySelector('.rows');

    function build() {
      rows.innerHTML = '';
      const probe = document.createElement('div');
      probe.className = 'row';
      probe.textContent = 'Du bleibst';
      rows.appendChild(probe);
      const count = Math.ceil(window.innerHeight / probe.offsetHeight) + 1;
      rows.innerHTML = '';

      for (let i = 0; i < count; i++) {
        const row = document.createElement('div');
        row.className = 'row';
        const track = document.createElement('div');
        track.className = 'track';
        const half = '<span>Du bleibst</span>'.repeat(8);
        track.innerHTML = half + half;
        track.style.animationDirection = i % 2 ? 'reverse' : 'normal';
        track.style.animationDuration = (30 + (i % 3) * 8) + 's';
        row.appendChild(track);
        rows.appendChild(row);
      }
    }

    build();
    let t;
    window.addEventListener('resize', () => {
      clearTimeout(t);
      t = setTimeout(build, 200);
    });
  </script>
</body>
</html>
